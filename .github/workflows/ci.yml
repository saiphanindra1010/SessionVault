name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          SESSIONVAULT_MODE: neon
          DATABASE_URL: postgresql://user:pass@localhost/db
          OPENAI_API_KEY: sk-build-placeholder
          SESSIONVAULT_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SESSIONVAULT_AUDIT_SALT: build-salt-placeholder
          PUBLIC_URL: http://localhost:3000
          RESEND_API_KEY: re_build_placeholder
